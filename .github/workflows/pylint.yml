name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3

      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config python3-dev gir1.2-glib-2.0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-deps -e .
        pip install pylint

    - name: Run Pylint
      run: |
        pylint src/**/*.py --extension-pkg-whitelist=cv2 > pylint_report.txt || true
        cat pylint_report.txt
        SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/10.*/\1/p' pylint_report.txt)
        if [ -z "$SCORE" ]; then SCORE="0"; fi
        echo "PYLINT_SCORE=$SCORE" >> $GITHUB_ENV

    - name: Update Badge
      uses: Schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: d09cfb9f249c9995b9fa1943d90a1d71
        filename: pylint.json
        label: PyLint
        message: ${{ env.PYLINT_SCORE }}/10
        valColorRange: ${{ env.PYLINT_SCORE }}
        maxColorRange: 10
        minColorRange: 0
