[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ROB6213"
version = "0.1.0"
dynamic = []
description = "ROB6213 Lab and Project Solutions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Long Quang", email = "longpquang@gmail.com"}
]
dependencies = [
  "setuptools",
  "typeguard",
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "opencv-python-headless",
  "opencv-contrib-python-headless",
  "serial"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.8",
  "ipykernel>=6.29",
  "nicegui",
  "pywebview",
]
docs = [
  "sphinx>=7.2",
  "myst-nb>=1.1",
  "sphinx-book-theme>=1.1",
  "nbsphinx>=0.9",
  "jupytext>=1.15"
]

[project.scripts]
gui = "robot_python_code.robot_gui:main"

[tool.hatch.build.targets.wheel.force-include]
"docs/assets" = "robot_python_code/assets"

[tool.hatch.build.targets.sdist.force-include]
"docs/assets" = "robot_python_code/assets"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_python_code"]

[tool.hatch.version]
path = "src/robot_python_code/__about__.py"

[tool.pytest.ini_options]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
select = ["E", "F", "I", "UP", "B"]
line-length = 88

[tool.hatch.build.targets.sdist]
exclude = [
  "src/robot_arduino_code"
]

[tool.setuptools.package-data]
"*" = ["data/*"]